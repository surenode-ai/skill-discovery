[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-discovery"
version = "0.1.0"
description = "Endpoint inventory agent for AI agent skills: scan local skill folders, fingerprint and sanitize what is found, and report the inventory to a governance server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Surenode", email = "oss@surenode.ai" }]
keywords = ["ai-agents", "skills", "inventory", "posture", "endpoint", "governance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "PyYAML>=5.4",
]

[project.scripts]
skill-discovery = "discovery.cli:run"

[tool.setuptools.packages.find]
include = ["discovery*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Lint against the minimum supported Python so version-specific syntax (e.g. a
# multi-line f-string expression, valid only on 3.12+) is caught locally and in
# CI rather than at runtime on a 3.9 job.
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F"]  # syntax/runtime errors + pyflakes (unused/undefined names)
