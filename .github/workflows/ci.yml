name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Lint (target py39 catches version-specific syntax)
        run: ruff check discovery tests noxfile.py

  test:
    strategy:
      fail-fast: false
      matrix:
        # Every supported version on Linux; the endpoints (min + max) on macOS
        # and Windows. Keep in sync with noxfile.py and pyproject classifiers
        # when a new Python ships.
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.9" }
          - { os: windows-latest, python: "3.14" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q
      - name: CLI dry run works offline against a generated fixture (OS-agnostic)
        shell: python
        run: |
          import json, pathlib, subprocess, sys, tempfile
          root = pathlib.Path(tempfile.mkdtemp()) / "skills" / "demo"
          root.mkdir(parents=True)
          (root / "SKILL.md").write_text("---\nname: demo\ndescription: CI check.\n---\n\nBody.\n", encoding="utf-8")
          out = subprocess.run(
              [sys.executable, "-m", "discovery.cli", "--path", str(root.parent),
               "--dry-run", "--print-json"],
              capture_output=True, text=True, check=True).stdout
          report = json.loads(out)
          assert report["items"][0]["name"] == "demo", report
          assert report["items"][0]["fingerprint"].startswith("sha256:"), report
          print("dry-run OK, scanner:", report["meta"]["scanner"])
